name: Pages

# The default Actions token cannot create a Pages site. One-time, in a browser:
# https://github.com/YauhenBichel/python-vibe/settings/pages
# Build and deployment → Source → GitHub Actions.
# Then re-run this workflow.

on:
  push:
    branches:
      # Default branch only. `deploy` has no guard of its own, so any branch
      # listed here can replace the published site.
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - name: Explain a Setup Pages failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "Setup Pages failed. Open"
          echo "https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "and set Build and deployment -> Source -> GitHub Actions."
          echo "GITHUB_TOKEN cannot create the site itself."
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
