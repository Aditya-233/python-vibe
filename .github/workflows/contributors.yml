name: Contributors

# Fills the README markers from the GitHub contributors API
# (commit order, bots omitted). Do not hardcode names or counts.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  readme:
    # Runs on the default branch, whatever it is called. Naming it here is
    # how the Pages workflow went quiet when the default was renamed.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not by tag: this job has contents: write,
      # and a tag can be moved to point at different code.
      - uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f  # v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image_size: 48
          columns_per_row: 6
